background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <div style=\"font-size: 13px; color: #475569; font-weight: 600\">Pacing vs plan<\/div>\n        <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; margin-top: 6px; color: #B45309\">\u22122 lessons<\/div>\n        <div style=\"font-size: 13px; color: #475569; margin-top: 6px\">Plan expected 28 by week 12<\/div>\n      <\/div>\n      <div style=\"flex: 1 1 200px; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <div style=\"font-size: 13px; color: #475569; font-weight: 600\">Needed pace to finish<\/div>\n        <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; margin-top: 6px\">2.5 / wk<\/div>\n        <div style=\"font-size: 13px; color: #475569; margin-top: 6px\">Current pace: 2.2 lessons a week<\/div>\n      <\/div>\n      <div style=\"flex: 1 1 200px; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <div style=\"font-size: 13px; color: #475569; font-weight: 600\">Days logged<\/div>\n        <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; margin-top: 6px\">54 / 57<\/div>\n        <div style=\"font-size: 13px; color: #475569; margin-top: 6px\">3 days not marked complete<\/div>\n      <\/div>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n      <section aria-labelledby=\"pace-h\" style=\"flex: 3 1 520px; min-width: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <h2 id=\"pace-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">Planned vs actual coverage<\/h2>\n        <p style=\"margin: 4px 0 0; font-size: 13px; color: #475569\">At the current pace you would reach about 93% by the end of the year, leaving roughly 6 lessons untaught.<\/p>\n        <div style=\"display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: #334155; flex-wrap: wrap\">\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 18px; height: 3px; background: #94A3B8\"><\/span>Plan<\/span>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 18px; height: 3px; background: #0F766E\"><\/span>Actual<\/span>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 18px; height: 0; border-top: 3px dashed #B45309\"><\/span>Projected<\/span>\n        <\/div>\n        <svg role=\"img\" aria-label=\"Line chart: planned coverage rises to 100% by week 36; actual coverage is 31% at week 12 against 33% planned; projection reaches 93%.\" viewBox=\"0 0 600 240\" style=\"width: 100%; height: auto; margin-top: 8px\">\n          <g font-family=\"Inter, sans-serif\" font-size=\"11\" fill=\"#475569\">\n            <line x1=\"40\" y1=\"200\" x2=\"580\" y2=\"200\" stroke=\"#CBD5E1\"><\/line>\n            <line x1=\"40\" y1=\"155\" x2=\"580\" y2=\"155\" stroke=\"#F1F5F9\"><\/line>\n            <line x1=\"40\" y1=\"110\" x2=\"580\" y2=\"110\" stroke=\"#F1F5F9\"><\/line>\n            <line x1=\"40\" y1=\"65\" x2=\"580\" y2=\"65\" stroke=\"#F1F5F9\"><\/line>\n            <line x1=\"40\" y1=\"20\" x2=\"580\" y2=\"20\" stroke=\"#F1F5F9\"><\/line>\n            <text x=\"32\" y=\"204\" text-anchor=\"end\">0%<\/text>\n            <text x=\"32\" y=\"114\" text-anchor=\"end\">50%<\/text>\n            <text x=\"32\" y=\"24\" text-anchor=\"end\">100%<\/text>\n            <text x=\"40\" y=\"220\" text-anchor=\"middle\">Wk 0<\/text>\n            <text x=\"220\" y=\"220\" text-anchor=\"middle\">Wk 12<\/text>\n            <text x=\"400\" y=\"220\" text-anchor=\"middle\">Wk 24<\/text>\n            <text x=\"580\" y=\"220\" text-anchor=\"middle\">Wk 36<\/text>\n          <\/g>\n          <line x1=\"220\" y1=\"20\" x2=\"220\" y2=\"200\" stroke=\"#F59E0B\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\/line>\n          <text x=\"226\" y=\"32\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#92400E\">Today<\/text>\n          <line x1=\"40\" y1=\"200\" x2=\"580\" y2=\"20\" stroke=\"#94A3B8\" stroke-width=\"2.5\"><\/line>\n          <polyline points=\"220,144.2 580,32.6\" fill=\"none\" stroke=\"#B45309\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"><\/polyline>\n          <polyline points=\"40,200 55,196.4 70,191 85,185.6 100,180.2 115,174.8 130,169.4 145,165.8 160,160.4 175,156.8 190,153.2 205,147.8 220,144.2\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"3\" stroke-linejoin=\"round\"><\/polyline>\n          <circle cx=\"220\" cy=\"144.2\" r=\"5\" fill=\"#0F766E\"><\/circle>\n          <text x=\"572\" y=\"46\" text-anchor=\"end\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#92400E\">93% projected<\/text>\n        <\/svg>\n      <\/section>\n\n      <section aria-labelledby=\"unit-h\" style=\"flex: 2 1 380px; min-width: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <h2 id=\"unit-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">Coverage by unit<\/h2>\n        <p style=\"margin: 4px 0 0; font-size: 13px; color: #475569\">Click a unit to see what is left.<\/p>\n        <ul style=\"list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px\">\n          <sc-for list=\"{{units}}\" as=\"u\" hint-placeholder-count=\"6\">\n            <li>\n              <button type=\"button\" onClick=\"{{u.pick}}\" aria-expanded=\"{{u.open}}\" style=\"width: 100%; text-align: left; padding: 10px; border-radius: 10px; border: 1px solid {{u.border}}; background: #FFFFFF; font-family: inherit; cursor: pointer; color: #0F172A\">\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px; gap: 8px\"><span style=\"font-weight: 600\">{{u.name}}<\/span><span style=\"color: #334155; white-space: nowrap\">{{u.done}}/{{u.total}}<\/span><\/div>\n                <div style=\"height: 8px; border-radius: 99px; background: #E2E8F0; margin-top: 8px\"><div style=\"height: 8px; border-radius: 99px; background: {{u.color}}; width: {{u.pct}}\"><\/div><\/div>\n              <\/button>\n              <sc-if value=\"{{u.isOpen}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"padding: 10px 12px 4px; font-size: 13px; color: #334155; line-height: 1.5\"><strong>Remaining:<\/strong> {{u.left}}<\/div>\n              <\/sc-if>\n            <\/li>\n          <\/sc-for>\n        <\/ul>\n      <\/section>\n    <\/div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n      <section aria-labelledby=\"time-h\" style=\"flex: 3 1 520px; min-width: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <h2 id=\"time-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">Where class time actually goes<\/h2>\n        <p style=\"margin: 4px 0 0; font-size: 13px; color: #475569\">Average minutes per day, planned vs logged. Rich tasks and discussion are being squeezed.<\/p>\n        <div style=\"display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: #334155\">\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #CBD5E1\"><\/span>Planned<\/span>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #1D4ED8\"><\/span>Actual<\/span>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 14px\">\n          <sc-for list=\"{{time}}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr) 70px; gap: 12px; align-items: center\">\n              <div style=\"font-size: 13px; font-weight: 600\">{{t.name}}<\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 3px\">\n                <div style=\"height: 9px; border-radius: 3px; background: #CBD5E1; width: {{t.pw}}\"><\/div>\n                <div style=\"height: 9px; border-radius: 3px; background: #1D4ED8; width: {{t.aw}}\"><\/div>\n              <\/div>\n              <div style=\"font-size: 13px; text-align: right; font-weight: 600; color: {{t.dc}}\">{{t.delta}}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n\n      <section aria-labelledby=\"rt-h\" style=\"flex: 2 1 380px; min-width: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 22px 24px\">\n        <h2 id=\"rt-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">Covered, but not yet learned<\/h2>\n        <p style=\"margin: 4px 0 0; font-size: 13px; color: #475569\">Topics marked done where exit tickets stayed low.<\/p>\n        <ul style=\"list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px\">\n          <li style=\"display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 10px; background: #FEF2F2\"><span style=\"font-size: 14px\">Dividing fractions<\/span><strong style=\"color: #B91C1C\">48%<\/strong><\/li>\n          <li style=\"display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 10px; background: #FEF2F2\"><span style=\"font-size: 14px\">Coefficients vs constants<\/span><strong style=\"color: #B91C1C\">55%<\/strong><\/li>\n          <li style=\"display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 10px; background: #FFF7ED\"><span style=\"font-size: 14px\">Inequality symbols on number lines<\/span><strong style=\"color: #B45309\">61%<\/strong><\/li>\n        <\/ul>\n        <button type=\"button\" style=\"margin-top: 14px; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; color: #0F172A\">Add a 10-min reteach to next week<\/button>\n      <\/section>\n    <\/div>\n  <\/main>\n<\/div>\n", "js": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { open: 1 }; }\n  renderVals() {\n    const self = this;\n    const U = [\n      ['1 \u00b7 Rational number operations', 12, 12, 'None. Unit complete.'],\n      ['2 \u00b7 Ratios & proportional relationships', 9, 15, 'Constant of proportionality, graphing proportions, percent increase/decrease, simple interest, scale drawings, unit test.'],\n      ['3 \u00b7 Expressions & equations', 4, 16, 'Multi-step equations, word problems with equations, combining like terms, factoring basics, and 8 more lessons.'],\n      ['4 \u00b7 Inequalities', 1, 10, 'Solving one- and two-step inequalities, graphing solutions, real-world inequalities, and 6 more lessons.'],\n      ['5 \u00b7 Geometry', 0, 18, 'Whole unit: angles, area, circles, surface area, volume, cross-sections.'],\n      ['6 \u00b7 Statistics & probability', 0, 14, 'Whole unit: sampling, comparing data sets, probability models.']\n    ];\n    const units = U.map(function (u, i) {\n      const pct = Math.round(u[1] / u[2] * 100);\n      return { name: u[0], done: u[1], total: u[2], pct: pct + '%', left: u[3],\n        color: pct === 100 ? '#0F766E' : '#1D4ED8',\n        isOpen: self.state.open === i, open: self.state.open === i ? 'true' : 'false',\n        border: self.state.open === i ? '#1D4ED8' : '#E2E8F0',\n        pick: function () { self.setState({ open: self.state.open === i ? -1 : i }); } };\n    });\n    const TM = [['Retrieval & Fluency', 8, 11], ['Explicit Modeling', 18, 21], ['High-Cognitive Tasks', 18, 12], ['Structured Discourse', 12, 7], ['Small Group / Practice', 18, 16], ['Formative Assessment', 5, 4]];\n    const time = TM.map(function (t) {\n      const d = t[2] - t[1];\n      return { name: t[0], pw: (t[1] / 25 * 100) + '%', aw: (t[2] / 25 * 100) + '%',\n        delta: (d > 0 ? '+' : '') + d + ' min', dc: d <= -3 ? '#B91C1C' : (d >= 3 ? '#B45309' : '#334155') };\n    });\n    return { units: units, time: time };\n  }\n}\n"}, "Features": {"title": "Feature map", "html": "\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #F4F6FA; min-height: 100vh; display: flex; flex-wrap: wrap\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 232px; background: #14213D; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px\">\n    <a href=\"Login.dc.html\" aria-label=\"Teachify, sign out\" style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; text-decoration: none; color: #FFFFFF\">\n      <svg role=\"img\" aria-label=\"Teachify logo\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><rect width=\"40\" height=\"40\" rx=\"11\" fill=\"#F59E0B\"><\/rect><path d=\"M8 11.5c4.2-2.2 8.4-2.2 12 .4 3.6-2.6 7.8-2.6 12-.4v4.6c-4.2-2.2-8.4-2.2-12 .4-3.6-2.6-7.8-2.6-12-.4z\" fill=\"#14213D\"><\/path><rect x=\"17.8\" y=\"16\" width=\"4.4\" height=\"15\" rx=\"2.2\" fill=\"#14213D\"><\/rect><circle cx=\"29.5\" cy=\"28.5\" r=\"3\" fill=\"#FFFFFF\"><\/circle><\/svg>\n      <span style=\"font-family: Lexend, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em\">TEACH<span style=\"color: #F59E0B\">IFY<\/span><\/span>\n    <\/a>\n    <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Today<\/a>\n    <a href=\"Planner.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Planner<\/a>\n    <a href=\"Lesson.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z\"><\/path><\/svg>Today's lesson<\/a>\n    <a href=\"Analytics.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Analytics<\/a>\n    <a href=\"Features.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #FFFFFF; background: rgba(255,255,255,0.12); text-decoration: none; font-weight: 600; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><\/svg>All features<\/a>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px\">\n\n    <header style=\"background: #14213D; color: #FFFFFF; border-radius: 20px; padding: 32px 34px\">\n      <div style=\"font-size: 13px; font-weight: 700; color: #FCD34D; text-transform: uppercase; letter-spacing: 0.08em\">Feature map<\/div>\n      <h1 style=\"margin: 10px 0 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.02em; max-width: 860px; line-height: 1.15\">One place to plan, teach, reflect and grow, built around the way teachers already work.<\/h1>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 26px\">\n        <div style=\"padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.07)\"><div style=\"font-weight: 700; font-size: 16px\">Plan in minutes, not evenings<\/div><div style=\"font-size: 13px; color: #CBD5E1; margin-top: 6px; line-height: 1.5\">A full year paced from your syllabus. Weeks that re-plan themselves.<\/div><\/div>\n        <div style=\"padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.07)\"><div style=\"font-weight: 700; font-size: 16px\">Always know where you stand<\/div><div style=\"font-size: 13px; color: #CBD5E1; margin-top: 6px; line-height: 1.5\">What's covered, what's left, and what was taught but not yet learned.<\/div><\/div>\n        <div style=\"padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.07)\"><div style=\"font-weight: 700; font-size: 16px\">Grow as a professional<\/div><div style=\"font-size: 13px; color: #CBD5E1; margin-top: 6px; line-height: 1.5\">Coaching tips from your own classroom data and a portfolio for appraisals.<\/div><\/div>\n      <\/div>\n    <\/header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between\">\n      <div role=\"tablist\" aria-label=\"Stage\" style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n        <sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"6\">\n          <button type=\"button\" role=\"tab\" aria-selected=\"{{s.sel}}\" onClick=\"{{s.pick}}\" style=\"padding: 10px 16px; border-radius: 99px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer\">{{s.label}} <span style=\"opacity: 0.75\">\u00b7 {{s.n}}<\/span><\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: flex; gap: 14px; font-size: 13px; color: #334155\">\n        <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"padding: 2px 8px; border-radius: 6px; background: #DCFCE7; color: #166534; font-weight: 700; font-size: 11px\">CORE<\/span>Version 1<\/span>\n        <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"padding: 2px 8px; border-radius: 6px; background: #E0E7FF; color: #3730A3; font-weight: 700; font-size: 11px\">NEXT<\/span>Version 2<\/span>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n      <sc-for list=\"{{cards}}\" as=\"c\" hint-placeholder-count=\"9\">\n        <button type=\"button\" onClick=\"{{c.pick}}\" aria-expanded=\"{{c.open}}\" style=\"text-align: left; background: #FFFFFF; border: 2px solid {{c.border}}; border-radius: 16px; padding: 20px; font-family: inherit; cursor: pointer; color: #0F172A; display: flex; flex-direction: column; gap: 10px\">\n          <span style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%\">\n            <span style=\"font-size: 12px; font-weight: 700; color: {{c.stageColor}}; text-transform: uppercase; letter-spacing: 0.06em\">{{c.stage}}<\/span>\n            <span style=\"padding: 2px 8px; border-radius: 6px; background: {{c.tagBg}}; color: {{c.tagFg}}; font-weight: 700; font-size: 11px\">{{c.tag}}<\/span>\n          <\/span>\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.3\">{{c.name}}<\/span>\n          <span style=\"font-size: 14px; color: #334155; line-height: 1.5\">{{c.what}}<\/span>\n          <sc-if value=\"{{c.isOpen}}\" hint-placeholder-val=\"{{false}}\">\n            <span style=\"display: block; padding: 12px; border-radius: 10px; background: #FFFBEB; font-size: 13px; line-height: 1.5; color: #78350F\"><strong>Why teachers care:<\/strong> {{c.why}}<\/span>\n          <\/sc-if>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n  <\/main>\n<\/div>\n", "js": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { stage: 'All', open: null }; }\n  renderVals() {\n    const self = this, st = this.state;\n    const COL = { Plan: '#1D4ED8', Teach: '#B45309', Reflect: '#0F766E', Grow: '#7C3AED', Connect: '#BE185D' };\n    const F = [\n      ['Plan', 'CORE', 'Weekly & monthly planner', 'Your teaching framework as a grid. Every cell opens the exact content to teach.', 'It mirrors the plan they already make on paper, so there is nothing new to learn.'],\n      ['Plan', 'CORE', 'Syllabus to year plan', 'Upload the scheme of work or textbook contents. Get a full-year plan paced around holidays and exams.', 'The most dreaded job of the year, done before the first week starts.'],\n      ['Plan', 'CORE', 'Self-adjusting weeks', 'Unfinished blocks roll forward. A surprise holiday shifts the whole plan, not just one day.', 'No more rewriting the plan by hand every time a day is lost.'],\n
