[st.cls];\n    const rawPlan = st.cls === '8A' ? PLAN8 : PLAN78;\n    const doneArr = st.done[st.cls];\n    const nowIdx = doneArr.indexOf(false);\n    const plan = rawPlan.map(function (r, i) {\n      const d = doneArr[i];\n      return { id: 'blk' + i, time: r[0], comp: r[1], title: r[2], done: d, isNow: i === nowIdx,\n        strike: d ? 'line-through' : 'none', fg: d ? '#64748B' : '#0F172A',\n        bg: i === nowIdx ? '#FFFBEB' : '#FFFFFF', border: i === nowIdx ? '#F59E0B' : '#E2E8F0',\n        toggle: function () { const all = Object.assign({}, st.done); const a = all[st.cls].slice(); a[i] = !a[i]; all[st.cls] = a; self.setState({ done: all, left: 760 }); } };\n    });\n    const doneCount = doneArr.filter(Boolean).length;\n    const now = nowIdx === -1 ? { title: 'All blocks done for today', comp: 'Time to wrap up' } : { title: rawPlan[nowIdx][2], comp: rawPlan[nowIdx][1] };\n    const nextIdx = nowIdx === -1 ? -1 : doneArr.indexOf(false, nowIdx + 1);\n    const circ = 2 * Math.PI * 38;\n    const mm = Math.floor(st.left / 60), ss = st.left % 60;\n    const classTabs = ['7A', '7B', '8A'].map(function (c) {\n      return { label: CLASSES[c].short, sel: st.cls === c ? 'true' : 'false', bg: st.cls === c ? '#FFFFFF' : 'transparent',\n        pick: function () { self.setState({ cls: c, left: 760, running: false, coach: 0 }); } };\n    });\n    const COACH = st.cls === '8A' ? [\n      ['Big idea', 'Slope is the rate of change: how much y changes every time x goes up by 1.'],\n      ['Watch for', 'Students mixing up rise and run, or reading the intercept as the slope.'],\n      ['Ask this', '\"If the line were steeper, what would that mean for the phone bill?\"'],\n      ['Hook', 'Show two real mobile packages and ask which one they would pick after 3 months.']\n    ] : [\n      ['Big idea', 'A ratio is a recipe: scale every part by the same factor. Tape diagrams make that factor visible.'],\n      ['Watch for', 'Students adding the same amount to both parts (3:5 \u2192 5:7) instead of multiplying.'],\n      ['Ask this', '\"If one box is worth 5 cups, how do you know what the whole recipe makes?\"'],\n      ['Hook', 'Bring a real mango shake recipe. Ask: how do we make enough for the whole class?']\n    ];\n    const coachTabs = COACH.map(function (c, i) {\n      const on = st.coach === i;\n      return { label: c[0], sel: on ? 'true' : 'false', bg: on ? '#14213D' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0F172A', border: on ? '#14213D' : '#CBD5E1',\n        pick: function () { self.setState({ coach: i }); } };\n    });\n    const P = [['great', 'Engaged', '#16A34A', '#F0FDF4', 'Great moment to push the stretch task to Group C.'],\n               ['ok', 'Mixed', '#D97706', '#FFFBEB', 'Try a 1-minute turn-and-talk before moving on.'],\n               ['tough', 'Restless', '#DC2626', '#FEF2F2', 'Switch to a stand-up activity: students show ratios with their fingers.']];\n    const pulse = P.map(function (p) {\n      const on = st.pulse === p[0];\n      return { label: p[1], dot: p[2], bg: on ? p[3] : '#FFFFFF', border: on ? p[2] : '#E2E8F0', on: on ? 'true' : 'false',\n        pick: function () { self.setState({ pulse: p[0] }); } };\n    });\n    const pSel = P.filter(function (p) { return p[0] === st.pulse; })[0];\n    const S = [['Hamza A.', 'HA', 'Absent yesterday, missed algebra tiles', '#1D4ED8'], ['Zainab K.', 'ZK', 'Exit tickets down 3 days in a row', '#B45309'], ['Ali R.', 'AR', 'Finished every task early: try the stretch', '#0F766E']];\n    const students = S.map(function (s, i) {\n      const key = st.cls + i, on = !!st.checked[key];\n      return { name: s[0], initials: s[1], why: s[2], color: s[3], on: on ? 'true' : 'false',\n        btn: on ? 'Checked in' : 'Check in', bg: on ? '#0F766E' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0F172A', border: on ? '#0F766E' : '#CBD5E1',\n        toggle: function () { const c = Object.assign({}, st.checked); c[key] = !c[key]; self.setState({ checked: c }); } };\n    });\n    const W = [['Mon', '6/6', 'Monday \u00b7 complete', 'Algebra tiles: 2x + 3 = 11'], ['Tue', doneCount + '/6', 'Tuesday \u00b7 today', 'Ratios with tape diagrams'], ['Wed', '0/6', 'Wednesday', 'Inequalities on number lines'], ['Thu', '0/6', 'Thursday', 'Inverse operations'], ['Fri', '0/6', 'Friday', 'Rates: best value + milestone check']];\n    const week = W.map(function (w, i) {\n      const on = st.day === i;\n      return { day: w[0], count: w[1], on: on ? 'true' : 'false',\n        bg: i === 0 ? '#ECFDF5' : (i === 1 ? '#FFFBEB' : '#FFFFFF'), border: on ? '#0F172A' : (i === 1 ? '#F59E0B' : '#E2E8F0'),\n        pick: function () { self.setState({ day: i }); } };\n    });\n    return {\n      classTabs: classTabs, klass: k, plan: plan, now: now, doneCount: doneCount,\n      nowLabel: nowIdx === -1 ? 'Done for today' : 'Teaching now \u00b7 block ' + (nowIdx + 1) + ' of 6',\n      nextTitle: nextIdx === -1 ? 'Wrap-up and exit ticket review' : rawPlan[nextIdx][2],\n      ringDash: (circ * doneCount / 6).toFixed(1) + ' ' + circ.toFixed(1),\n      dayMsg: doneCount === 6 ? 'Day complete!' : (doneCount >= 3 ? 'Past halfway' : 'Good start'),\n      clock: mm + ':' + (ss < 10 ? '0' : '') + ss, timerPct: Math.round(st.left / 1080 * 100) + '%',\n      timerColor: st.left < 120 ? '#FCA5A5' : '#FFFFFF', timerBtn: st.running ? 'Pause' : 'Start',\n      toggleTimer: function () { self.setState({ running: !st.running }); },\n      resetTimer: function () { self.setState({ left: 1080, running: false }); },\n      markNowDone: function () { if (nowIdx === -1) return; const all = Object.assign({}, st.done); const a = all[st.cls].slice(); a[nowIdx] = true; all[st.cls] = a; self.setState({ done: all, left: 1080, running: false }); },\n      weekDone: k.weekBase + doneCount,\n      coachTabs: coachTabs, coachText: COACH[st.coach][1],\n      nextTip: function () { self.setState({ coach: (st.coach + 1) % 4 }); },\n      pulse: pulse, pulseTip: pSel ? 'Lesson Coach suggests: ' + pSel[4] : 'Tap one. Lesson Coach will suggest a quick move for the class mood.',\n      students: students, week: week, dayPreview: { label: W[st.day][2], topic: W[st.day][3] },\n      draft: st.draft, notes: st.notes,\n      setDraft: function (e) { self.setState({ draft: e.target.value }); },\n      addNote: function () { if (!st.draft.trim()) return; self.setState({ notes: [st.draft.trim()].concat(st.notes), draft: '' }); }\n    };\n  }\n}\n"}, "Planner": {"title": "Planner \u2014 week and month", "html": "\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #F4F6FA; min-height: 100vh; display: flex; flex-wrap: wrap\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 232px; background: #14213D; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px\">\n    <a href=\"Login.dc.html\" aria-label=\"Teachify, sign out\" style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; text-decoration: none; color: #FFFFFF\">\n      <svg role=\"img\" aria-label=\"Teachify logo\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><rect width=\"40\" height=\"40\" rx=\"11\" fill=\"#F59E0B\"><\/rect><path d=\"M8 11.5c4.2-2.2 8.4-2.2 12 .4 3.6-2.6 7.8-2.6 12-.4v4.6c-4.2-2.2-8.4-2.2-12 .4-3.6-2.6-7.8-2.6-12-.4z\" fill=\"#14213D\"><\/path><rect x=\"17.8\" y=\"16\" width=\"4.4\" height=\"15\" rx=\"2.2\" fill=\"#14213D\"><\/rect><circle cx=\"29.5\" cy=\"28.5\" r=\"3\" fill=\"#FFFFFF\"><\/circle><\/svg>\n      <span style=\"font-family: Lexend, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em\">TEACH<span style=\"color: #F59E0B\">IFY<\/span><\/span>\n    <\/a>\n    <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-li ader>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #475569; align-items: center\">\n      <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #F0FDF4; border: 1px solid #16A34A\"><\/span>Completed<\/span>\n      <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #FFFBEB; border: 2px solid #F59E0B\"><\/span>Today<\/span>\n      <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #FFF7ED; border: 1px solid #EA580C\"><\/span>Partly done / carried over<\/span>\n      <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 1px solid #94A3B8\"><\/span>Planned<\/span>\n      <span style=\"margin-left: auto\">Click any cell to open what to teach<\/span>\n    <\/div>\n\n    <sc-if value=\"{{isWeek}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"overflow-x: auto; background: #FFFFFF; border-radius: 16px; border: 1px solid #E2E8F0; padding: 16px\">\n        <div style=\"min-width: 1040px; display: grid; grid-template-columns: 210px repeat(5, minmax(0, 1fr)); gap: 8px\">\n          <div style=\"padding: 10px 12px; font-size: 13px; font-weight: 700; color: #475569\">Component & timing<\/div>\n          <sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"padding: 10px 12px; border-radius: 10px; background: {{d.bg}}\">\n              <div style=\"font-weight: 700; font-size: 15px\">{{d.name}}<\/div>\n              <div style=\"font-size: 12px; color: #475569; margin-top: 2px\">{{d.sub}}<\/div>\n            <\/div>\n          <\/sc-for>\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"padding: 12px; bord ht: 700; font-size: 14px\">Tue<\/div>\n          <div style=\"padding: 8px 12px; font-weight: 700; font-size: 14px\">Wed<\/div>\n          <div style=\"padding: 8px 12px; font-weight: 700; font-size: 14px\">Thu<\/div>\n          <div style=\"padding: 8px 12px; font-weight: 700; font-size: 14px\">Fri<\/div>\n          <sc-for list=\"{{month}}\" as=\"w\" hint-placeholder-count=\"4\">\n            <div style=\"padding: 12px; border-radius: 10px; background: #F8FAFC\">\n              <div style=\"font-weight: 700; font-size: 14px\">{{w.label}}<\/div>\n              <div style=\"font-size: 12px; color: #475569; margin-top: 4px\">{{w.range}}<\/div>\n              <div style=\"height: 6px; border-radius: 99px; background: #E2E8F0; margin-top: 10px\"><div style=\"height: 6px; border-radius: 99px; background: #0F766E; width: {{w.pct}}\"><\/div><\/div>\n              <div style=\"font-size: 11px; color: #475569; margin-top: 4px\">{{w.pct}} done<\/div>\n            <\/div>\n            <sc-for list=\"{{w.days}}\" as=\"c\" hint-placeholder-count=\"5\">\n              <a href=\"Lesson.dc.html\" class=\"{{c.cls}}\" style=\"min-height: 92px\">\n                <div style=\"font-size: 12px; color: #475569; font-weight: 600\">{{c.date}}<\/div>\n                <div style=\"font-weight: 600; font-size: 13px; margin-top: 6px; line-height: 1.35\">{{c.title}}<\/div>\n              <\/a>\n            <\/sc-for>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n  <\/main>\n<\/div>\n", "js": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { view: 'week' }; }\n  renderVals() {\n    const isWeek = this.state.view === 'week';\n    const statusOf = function (dayIdx, rowIdx) {\n      if (dayIdx === 0) return rowIdx === 4 ? 'partial' : 'done';\n      if (dayIdx === 1) return rowIdx === 0 ? 'done' : (rowIdx === 1 ? 'now' : 'plan');\n      return 'plan';\n    };\n    const clsOf = function (s) { return s === 'done' ? 'cell done' : (s === 'now' ? 'cell now' : (s === 'partial' ? 'cell partial' : 'cell')); };\n    const data = [\n      ['Retrieval & Fluency', '5\u201310 min', 'Relieve cognitive load & build automaticity', '#0F766E', [\n        ['Spiraled Review', 'Equivalent fraction speed match & mental multiplication.'],\n        ['Number Talk', 'Deconstructing 3-digit multiplication strategies mentally.'],\n        ['Fluency Sprint', 'Proportional relationships & unit rate quick-recall.'],\n        ['Targeted Drill', 'Decimal-to-percent rapid conversion cards.'],\n        ['Cumulative Grid', 'Mixed basic operations & integer sign rules.']]],\n      ['Explicit Modeling', '15\u201320 min', 'C-P-A progression & precise vocabulary', '#1D4ED8', [\n        ['I Do / We Do', 'Concrete algebra tiles to model 2x + 3 = 11. Vocab: coefficient, variable.'],\n        ['Pictorial Shift', 'Tape diagrams representing ratios in real-world recipe scaling.'],\n        ['Dual Coding', 'Visual number line with formal inequality symbols (\u2264, \u2265).'],\n        ['Abstract Transition', 'Solving multi-step equations using inverse operations.'],\n        ['Misconception Focus', 'Teacher modeling on common fraction division errors.']]],\n      ['High-Cognitive Tasks', '15\u201320 min', 'Productive struggle & schema strategies', '#7C3AED', [\n        ['Rich Task', 'Multi-step budget management word problem.'],\n        ['Schema Strategy', 'Categorizing word problems into \"Compare\" vs \"Change\".'],\n        ['Open-Ended', 'Design a scale map of a park given constraints.'],\n        ['Productive Struggle', 'Analyze 3 non-routine geometric perimeter puzzles.'],\n        ['Performance Challenge', 'Real-world rate optimization (best value purchase).']]],\n      ['Structured Discourse', '10\u201315 min', 'Argumentation & sentence frames', '#B45309', [\n        ['Turn-and-Talk', '\"I agree/disagree with [Name]\u2019s step because\u2026\"'],\n        ['Method Comparison', 'Double number lines vs. cross-multiplication.'],\n        ['Peer Critique', 'Evaluate and refine a partner\u2019s drafted proof.'],\n        ['Fishbowl Debate', 'Defend why a real-world scenario is non-linear.'],\n        ['Socratic Wrap-Up', 'Student-led defense of solution pathways.']]],\n      ['Small Group / Practice', '15\u201320 min', 'Tiered differentiation & immediate feedback', '#BE185D', [\n        ['Group A / B', 'A: manipulative scaffolding. B: accelerated extension.'],\n        ['Targeted Tier 2', 'Prerequisite gap closing using accessible numbers.'],\n        ['Guided Practice', 'Error-analysis stations with immediate feedback.'],\n        ['Flexible Tiers', 'Teacher-led guided group; others complete menu choice.'],\n        ['Differentiated Rotations', 'Skill mastery stations based on weekly data.']]],\n      ['Formative Assessment', '5 min', 'Progress monitoring & daily exit ticket', '#475569', [\n        ['Exit Ticket', '2-item check on identifying coefficients and constants.'],\n        ['Quick Check', 'Sketch a tape diagram for a 3:5 ratio scenario.'],\n        ['3-2-1 Slip', '3 facts, 2 connections, 1 remaining question.'],\n        ['Single-Item Assessment', 'Solve 1 multi-step inequality with work.'],\n        ['Weekly Milestone', '5-minute mastery check on core weekly standard.']]]\n    ];\n    const rows = data.map(function (r, ri) {\n      return { name: r[0], time: r[1], purpose: r[2], color: r[3], cells: r[4].map(function (c, di) {\n        const s = statusOf(di, ri);\n        return { title: c[0], desc: c[1], cls: clsOf(s), isDone: s === 'done' };\n      }) };\n    });\n    const days = [\n      { name: 'Monday', sub: '9 Nov \u00b7 complete', bg: '#F0FDF4' },\n      { name: 'Tuesday', sub: '10 Nov \u00b7 today', bg: '#FEF3C7' },\n      { name: 'Wednesday', sub: '11 Nov', bg: '#F8FAFC' },\n      { name: 'Thursday', sub: '12 Nov', bg: '#F8FAFC' },\n      { name: 'Friday', sub: '13 Nov', bg: '#F8FAFC' }\n    ];\n    const mk = function (dates, titles, statuses) {\n      return dates.map(function (d, i) { return { date: d, title: titles[i], cls: clsOf(statuses[i]) }; });\n    };\n    const month = [\n      { label: 'Week 11', range: '2\u20136 Nov', pct: '90%', days: mk(['2 Nov','3 Nov','4 Nov','5 Nov','6 Nov'], ['Integer operations', 'Integer sign rules', 'Fraction operations', 'Fraction division', 'Review & quiz'], ['done','done','done','partial','done']) },\n      { label: 'Week 12', range: '9\u201313 Nov', pct: '23%', days: mk(['9 Nov','10 Nov','11 Nov','12 Nov','13 Nov'], ['Algebra tiles: 2x + 3 = 11', 'Ratios with tape diagrams', 'Inequalities on number lines', 'Inverse operations', 'Rates: best value'], ['done','now','plan','plan','plan']) },\n      { label: 'Week 13', range: '16\u201320 Nov', pct: '0%', days: mk(['16 Nov','17 Nov','18 Nov','19 Nov','20 Nov'], ['Proportional relationships', 'Constant of proportionality', 'Graphing proportions', 'Percent increase', 'Milestone check'], ['plan','plan','plan','plan','plan']) },\n      { label: 'Week 14', range: '23\u201327 Nov', pct: '0%', days: mk(['23 Nov','24 Nov','25 Nov','26 Nov','27 Nov'], ['Percent problems', 'Simple interest', 'Scale drawings', 'Scale maps', 'Unit quiz'], ['plan','plan','plan','plan','plan']) }\n    ];\n    return {\n      rows: rows, days: days, month: month,\n      isWeek: isWeek, isMonth: !isWeek,\n      heading: isWeek ? 'Week 12 \u00b7 9\u201313 November' : 'November 2026',\n      weekBg: isWeek ? '#FFFFFF' : 'transparent',\n      monthBg: isWeek ? 'transparent' : '#FFFFFF',\n      toWeek: () => this.setState({ view: 'week' }),\n      toMonth: () => this.setState({ view: 'month' })\n    };\n  }\n}\n"}, "Lesson": {"title": "Lesson \u2014 what to teach today", "html": "\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #F4F6FA; min-height: 100vh; display: flex; flex-wrap: wrap\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 232px; background: #14213D; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: colu e 7 \u00b7 Mathematics<\/div><\/div>\n    <\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 40px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #475569\"><a href=\"Planner.dc.html\">Week 12<\/a> \u203a Tuesday, 10 Nov \u203a Grade 7-B<\/div>\n        <h1 style=\"margin: 6px 0 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em\">Ratios in real life: scaling a recipe<\/h1>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n          <span style=\"padding: 5px 10px; border-radius: 99px; background: #E0F2FE; color: #075985; font-size: 12px; font-weight: 600\">Unit 2 \u00b7 Ratios & proportional relationships<\/span>\n          <span style=\"padding: 5px 10px; border-radius: 99px; background: #F1F5F9; color: #334155; font-size: 12px; font-weight: 600\">79 min \u00b7 6 blocks<\/span>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; gap: 10px; align-items: center; flex-wrap: wrap\">\n        <div style=\"padding: 10px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E2E8F0; font-size: 14px\"><span style=\"color: #475569\">Block timer<\/span> <strong style=\"font-variant-numeric: tabular-nums\">12:40<\/strong><\/div>\n        <a href=\"LessonPlan.dc.html\" style=\"padding: 12px 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 14px; color: #0F172A; display: flex; gap: 8px; align-items: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2            <div style=\"font-size: 13px; font-weight: 700; color: #334155\">How far did each block get?<\/div>\n            <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; background: #F8FAFC; flex-wrap: wrap\">\n                <div style=\"font-size: 14px; font-weight: 600\">{{s.name}}<\/div>\n                <div role=\"group\" aria-label=\"{{s.name}} coverage\" style=\"display: flex; gap: 6px\">\n                  <sc-for list=\"{{s.opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" onClick=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\" style=\"padding: 8px 12px; min-height: 36px; border-radius: 8px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">{{o.label}}<\/button>\n                  <\/sc-for>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n            <div>\n              <div style=\"font-size: 13px; font-weight: 700; color: #334155\">How did the class do?<\/div>\n              <div role=\"group\" aria-label=\"Class understanding\" style=\"display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap\">\n                <sc-for list=\"{{und}}\" as=\"u\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" onClick=\"{{u.pick}}\" aria-pressed=\"{{u.on}}\" style=\"padding: 10px 14px; border-radius: 10px; border: 1px solid {{u.border}}; background: {{u.bg}}; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">{{u.label}}<\/button>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n            <div>\n              <label for=\"score\" style=\"font-size: 13px; font-weight: 700; color: #334155\">Exit ticket: students who got it right<\/label>\n              <div style=\"display: flex; gap: 8px; align-items: center; margin-top: 8px\"><input id=\"score\" type=\"number\" value=\"24\" style=\"width: 80px; padding: 10px; border-radius: 8px; border: 1px solid #94A3B8; font-family: inherit; font-size: 14px\"><span style=\"font-size: 14px; color: #475569\">of 32<\/span><\/div>\n            <\/div>\n            <div>\n              <label for=\"note\" style=\"font-size: 13px; font-weight: 700; color: #334155\">Note for next time (optional)<\/label>\n              <textarea id=\"note\" rows=\"2\" style=\"width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid #94A3B8; font-family: inherit; font-size: 14px; resize: vertical\">Group B needs more time on tape diagrams with fractions.<\/textarea>\n            <\/div>\n            <div style=\"display: flex; gap: 10px\">\n              <button type=\"button\" onClick=\"{{save}}\" style=\"padding: 12px 18px; border-radius: 10px; border: none; background: #0F766E; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer\">Save &amp; complete day<\/button>\n              <button type=\"button\" onClick=\"{{closePanel}}\" style=\"padding: 12px 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; color: #0F172A\">Cancel<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n    <\/sc-if>\n\n    <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\">\n      <section aria-live=\"polite\" style=\"background: #F0FDF4; border: 1px solid #86EFAC; border-radius: 16px; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n        <div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: #166534\">Tuesday is done. Nice work.<\/div>\n          <div style=\"font-size: 14px; color: #14532D; margin-top: 4px\">{{doneMsg}}<\/div>\n        <\/div>\n        <a href=\"Analytics.dc.html\" style=\"padding: 12px 16px; border-radius: 10px; background: #FFFFFF; border: 1px solid #86EFAC; text-decoration: none; font-weight: 600; font-size: 14px; color: #166534\">See syllabus progress<\/a>\n      <\/section>\n    <\/sc-if>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n      <section aria-label=\"Lesson blocks\" style=\"flex: 1 1 230px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px\">\n        <div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 10px\">Today's flow<\/div>\n        <ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px\">\n          <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"6\">\n            <li>\n              <button type=\"button\" onClick=\"{{s.select}}\" aria-current=\"{{s.current}}\" style=\"width: 100%; text-align: left; display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; border: 1px solid {{s.border}}; background: {{s.bg}}; font-family: inherit; cursor: pointer; color: #0F172A\">\n                <span style=\"width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{s.dotBg}}; color: {{s.dotFg}}\">{{s.num}}<\/span>\n                <span style=\"min-width: 0\">\n                  <span style=\"display: block; font-size: 13px; font-weight: 700\">{{s.name}}<\/span>\n                  <span style=\"display: block; font-size: 12px; color: #475569; margin-top: 2px\">{{s.comp}} \u00b7 {{s.min}}<\/span>\n                <\/span>\n              <\/button>\n            <\/li>\n          <\/sc-for>\n        <\/ol>\n      <\/section>\n\n      <article style=\"flex: 3 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px 28px\">\n        <div style=\"font-size: 12px; font-weight: 700; color: #1D4ED8; text-transform: uppercase; letter-spacing: 0.05em\">{{cur.comp}} \u00b7 {{cur.min}}<\/div>\n        <h2 style=\"margin: 6px 0 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 700\">{{cur.name}}<\/h2>\n        <div style=\"margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: #F0F9FF; font-size: 14px; line-height: 1.5\"><strong>Learning goal:<\/strong> {{cur.goal}}<\/div>\n        <h3 style=\"margin: 22px 0 10px; font-size: 15px; font-weight: 700\">What to teach<\/h3>\n        <ol style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.55\">\n          <sc-for list=\"{{cur.points}}\" as=\"pt\" hint-placeholder-count=\"4\"><li>{{pt}}<\/li><\/sc-for>\n        <\/ol>\n        <sc-if value=\"{{cur.hasVisual}}\" hint-placeholder-val=\"{{true}}\">\n          <figure style=\"margin: 22px 0 0; padding: 18px; border-radius: 12px; border: 1px dashed #94A3B8\">\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 90px; font-size: 13px; font-weight: 600\">Mango pulp<\/span><div style=\"display: flex; gap: 4px\"><span style=\"width: 56px; height: 34px; background: #FDE68A; border: 1px solid #B45309; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700\">5<\/span><span style=\"width: 56px; height: 34px; background: #FDE68A; border: 1px solid #B45309; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700\">5< \"display: flex; flex-wrap: wrap; gap: 8px\">\n          <sc-for list=\"{{cur.materials}}\" as=\"m\" hint-placeholder-count=\"3\"><span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">{{m}}<\/span><\/sc-for>\n        <\/div>\n      <\/article>\n\n      <aside aria-labelledby=\"ai-h\" style=\"flex: 2 1 300px; min-width: 0; background: #14213D; color: #FFFFFF; border-radius: 16px; padding: 20px\">\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F59E0B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z\"><\/path><\/svg>\n          <h2 id=\"ai-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700\">Lesson Coach<\/h2>\n        <\/div>\n        <a href=\"LessonPlan.dc.html\" style=\"margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; color: #0F172A; text-decoration: none\">\n          <svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6M8 13h8M8 17h5\"><\/path><\/svg>\n          <span style=\"flex-grow: 1\"><span style=\"display: block; font-weight: 700; font-size: 14px\">Complete lesson plan<\/span><span style=\"display: block; font-size: 12px; color: #475569\">Objectives, sequence, differentiation, assessment<\/span><\/span>\n          <svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg>\n        <\/a>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px\">\n          <sc-for list=\"{{tools}}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button type=\"button\" onClick=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\" style=\"padding: 10px; min-height: 44px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left\">{{t.label}}<\/button>\n          <\/sc-for>\n        <\/div>\n        <div style=\"margin-top: 16px; background: #FFFFFF; color: #0F172A; border-radius: 12px; padding: 16px\">\n          <div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em\">{{out.title}}<\/div>\n          <ul style=\"margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5\">\n            <sc-for list=\"{{out.items}}\" as=\"it\" hint-placeholder-count=\"3\"><li>{{it}}<\/li><\/sc-for>\n          <\/ul>\n          <div style=\"display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap\">\n            <button type=\"button\" style=\"padding: 8px 12px; border-radius: 8px; border: none; background: #0F766E; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Add to lesson<\/button>\n            <button type=\"button\" style=\"padding: 8px 12px; border-radius: 8px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Regenerate<\/button>\n            <button type=\"button\" style=\"padding: 8px 12px; border-radius: 8px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Print<\/button>\n          <\/div>\n        <\/div>\n        <label for=\"ask\" style=\"display: block; font-size: 13px; font-weight: 600; margin-top: 16px; color: #CBD5E1\">Ask about this lesson<\/label>\n        <div style=\"display: flex; gap: 8px; margin-top: 8px\">\n          <input id=\"ask\" type=\"text\" placeholder=\"e.g. Give me a real-life ratio example from soccer\" style=\"flex-grow: 1; min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid #475569; background: #1E2B4D; color: #FFFFFF; font-family: inherit; font-size: 13px\">\n          <button type=\"button\" aria-label=\"Send\" style=\"width: 44px; height: 44px; border-radius: 10px; border: none; background: #F59E0B; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#14213D\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/button>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/main>\n<\/div>\n", "js": "\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = { active: 1, tool: 'summary', panel: false, done: false, und: 'mixed',\n      cov: ['done', 'done', 'partial', 'done', 'skipped', 'done'] };\n  }\n  renderVals() {\n    const st = this.state;\n    const S = [\n      { name: 'Number Talk', comp: 'Retrieval & Fluency', min: '8 min', goal: 'Warm up mental multiplication by breaking 3-digit numbers into parts.', points: ['Write 125 \u00d7 8 on the board. Give 1 minute of silent thinking.', 'Collect 3 strategies (e.g. 100\u00d78 + 25\u00d78). Record each one visually.', 'Ask: which strategy would you use for 125 \u00d7 16? Why?'], materials: ['Whiteboard', 'Strategy chart'], hasVisual: false },\n      { name: 'Pictorial Shift: tape diagrams', comp: 'Explicit Modeling', min: '18 min', goal: 'Students represent a recipe ratio with a tape diagram and scale it to a new total.', points: ['I do: a mango shake uses 3 cups mango pulp for every 5 cups milk. Draw two tapes: 3 equal boxes and 5 equal boxes.', 'We do: the class party needs 40 cups in total. 8 boxes = 40 cups, so 1 box = 5 cups.', 'Ask: how much pulp? 3 \u00d7 5 = 15 cups. How much milk? 5 \u00d7 5 = 25 cups. Check: 15 + 25 = 40.', 'Key vocabulary: ratio, part, whole, unit value, scale factor.'], materials: ['Tape diagram template', 'Recipe cards (set A)', 'Slides 4\u20139'], hasVisual: true },\n      { name: 'Schema Strategy', comp: 'High-Cognitive Task', min: '18 min', goal: 'Sort word problems into \"Compare\" and \"Change\" structures before solving.', points: ['Give pairs 8 problem cards. They sort without solving.', 'Pairs justify one card to the class.', 'Solve one Compare and one Change problem with a diagram.'], materials: ['Problem card set', 'Sorting mat'], hasVisual: false },\n      { name: 'Method Comparison', comp: 'Structured Discourse', min: '12 min', goal: 'Compare double number lines and cross-multiplication for the same problem.', points: ['Show two student solutions side by side.', 'Turn-and-talk: \"Both methods work because\u2026\"', 'Agree as a class when each method is quicker.'], materials: ['Two sample solutions', 'Sentence frames'], hasVisual: false },\n      { name: 'Targeted Tier 2', comp: 'Small Group / Practice', min: '18 min', goal: 'Close prerequisite gaps in multiplication facts and equal parts.', points: ['Teacher works with Group A (9 students) using friendlier numbers.', 'Others complete practice set B on their own.', 'Swap feedback with a partner for the last 5 minutes.'], materials: ['Practice set B', 'Fraction strips'], hasVisual: false },\n      { name: 'Quick Check', comp: 'Formative Assessment', min: '5 min', goal: 'Check whether each student can draw a tape diagram for a 3:5 ratio.', points: ['Students sketch a tape diagram for a 3:5 ratio with a total of 24.', 'Collect slips at the door. Record how many got it right.'], materials: ['Exit slips'], hasVisual: false }\n    ];\n    const self = this;\n    const labels = { done: 'Done', partial: 'Partly', skipped: 'Skipped' };\n    const steps = S.map(function (s, i) {\n      const on = i === st.active;\n      const status = i === 0 ? 'done' : (i === 1 ? 'now' : 'next');\n      return {\n        num: String(i + 1), name: s.name, comp: s.comp, min: s.min, current: on ? 'step' : 'false',\n        bg: on ? '#EFF6FF' : '#FFFFFF', border: on ? '#1D4ED8' : '#E2E8F0',\n        dotBg: status === 'done' ? '#0F766E' : (status === 'now' ? '#F59E0B' : '#E2E8F0'),\n        dotFg: status === 'done' ? '#FFFFFF' : '#0F172A',\n        select: function () { self.setState({ active: i }); },\n        opts: ['done', 'partial', 'skipped'].map(function (k) {\n          const sel = st.cov[i] === k;\n          return { label: labels[k], on: sel ? 'true' : 'false',\n            bg: sel ? (k === 'done' ? '#0F766E' : (k === 'partial' ? '#B45309' : '#475569')) : '#FFFFFF',\n            fg: sel ? '#FFFFFF' : '#0F172A', border: sel ? 'transparent' : '#CBD5E1',\n            pick: function () { const c = st.cov.slice(); c[i] = k; self.setState({ cov: c }); } };\n        })\n      };\n    });\n    const T = [\n      ['summary', 'Summarize lesson'], ['simple', 'Explain simpler / in Spanish'], ['practice', 'Make practice questions'],\n      ['exit', 'Make exit ticket'], ['diff', 'Differentiate for groups'], ['mis', 'Likely misconceptions']\n    ];\n    const tools = T.map(function (t) {\n      const on = st.tool === t[0];\n      return { label: t[1], on: on ? 'true' : 'false', bg: on ? '#F59E0B' : 'transparent', fg: on ? '#14213D' : '#FFFFFF', border: on ? '#F59E0B' : '#475569',\n        pick: function () { self.setState({ tool: t[0] }); } };\n    });\n    const OUT = {\n      summary: { title: 'Lesson summary', items: ['A ratio compares parts; scaling keeps every part growing by the same factor.', 'Tape diagrams turn \"8 parts = 40 cups\" into \"1 part = 5 cups\", the unit value.', 'Students then multiply each part by the unit value and check that the parts add to the total.'] },\n      simple: { title: 'Simpler explanation', items: ['Think of the shake as boxes: 3 boxes of mango, 5 boxes of milk.', 'All boxes are the same size. If all 8 boxes hold 40 cups, one box holds 5.', 'Can switch this explanation to Spanish for English learners.'] },\n      practice: { title: '3 practice questions', items: ['Chai uses 2 cups milk for every 3 cups water. You make 25 cups. How much milk?', 'A class has boys and girls in the ratio 4:5. There are 36 students. How many girls?', 'Paint is mixed blue to white 1:4. You need 15 litres. How much white?'] },\n      exit: { title: 'Exit ticket (2 items)', items: ['Draw a tape diagram for a 3:5 ratio with a total of 24.', 'Explain in one sentence why 3:5 is not the same as 5:7.'] },\n      diff: { title: 'Differentiated tasks', items: ['Group A (support): same problems with totals that are multiples of 8; tape template given.', 'Group B (on level): mixed totals; draw their own diagram.', 'Group C (stretch): three-part ratios, e.g. 2:3:5 for a fruit salad.'] },\n      mis: { title: 'Likely misconceptions', items: ['Adding instead of multiplying: 3:5 becomes 5:7.', 'Confusing part with whole: dividing 40 by 3 instead of by 8.', 'Drawing boxes of unequal size, which hides the unit value.'] }\n    };\n    const U = [['got', 'Most got it'], ['mixed', 'Mixed'], ['reteach', 'Needs reteach']];\n    const und = U.map(function (u) {\n      const on = st.und === u[0];\n      return { label: u[1], on: on ? 'true' : 'false', bg: on ? '#E0F2FE' : '#FFFFFF', border: on ? '#0369A1' : '#CBD5E1', pick: function () { self.setState({ und: u[0] }); } };\n    });\n    const moved = st.cov.filter(function (c) { return c !== 'done'; }).length;\n    return {\n      steps: steps, cur: S[st.active], tools: tools, out: OUT[st.tool], und: und,\n      panel: st.panel && !st.done, done: st.done, notDone: !st.done,\n      doneMsg: (moved ? moved + ' unfinished block' + (moved > 1 ? 's' : '') + ' moved to Wednesday. ' : 'Everything covered. ') + 'Syllabus coverage is now 32%.',\n      openPanel: function () { self.setState({ panel: true }); },\n      closePanel: function () { self.setState({ panel: false }); },\n      save: function () { self.setState({ done: true, panel: false }); }\n    };\n  }\n}\n"}, "LessonPlan": {"title": "Lesson plan \u2014 Ratios in real life", "html": "\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #F4F6FA; min-height: 100vh; display: flex; flex-wrap: wrap\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 232px; background: #14213D; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px\">\n    <a href=\"Login.dc.html\" aria-label=\"Teachify, sign out\" style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; text-decoration: none; color: #FFFFFF\">\n      <svg role=\"img\" aria-label=\"Teachify logo\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><rect width=\"40\" height=\"40\" rx=\"11\" fill=\"#F59E0B\"><\/rect><path d=\"M8 11.5c4.2-2.2 8.4-2.2 12 .4 3.6-2.6 7.8-2.6 12-.4v4.6c-4.2-2.2-8.4-2.2-12 .4-3.6-2.6-7.8-2.6-12-.4z\" fill=\"#14213D\"><\/path><rect x=\"17.8\" y=\"16\" width=\"4.4\" height=\"15\" rx=\"2.2\" fill=\"#14213D\"><\/rect><circle cx=\"29.5\" cy=\"28.5\" r=\"3\" fill=\"#FFFFFF\"><\/circle><\/svg>\n      <span style=\"font-family: Lexend, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em\">TEACH<span style=\"color: #F59E0B\">IFY<\/span><\/span>\n    <\/a>\n    <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Today<\/a>\n    <a href=\"Planner.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Planner<\/a>\n    <a href=\"Lesson.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #FFFFFF; background: rgba(255,255,255,0.12); text-decoration: none; font-weight: 600; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z\"><\/path><\/svg>Today's lesson<\/a>\n    <a href=\"Analytics.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Analytics<\/a>\n    <a href=\"Features.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 14px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><\/svg>All features<\/a>\n    <div style=\"flex-grow: 1; min-height: 24px\"><\/div>\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.14)\">\n      <div style=\"width: 36px; height: 36px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">EC<\/div>\n      <div><div style=\"font-weight: 600; font-size: 14px\">Ms. Emily Carter<\/div><div style=\"font-size: 12px; color: #CBD5E1\">Grade 7 \u00b7 Mathematics<\/div><\/div>\n    <\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px\">\n\n    <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px\">\n      <div>\n        <div style=\"font-size: 13px; color: #475569\"><a href=\"Planner.dc.html\">Week 12<\/a> \u203a <a href=\"Lesson.dc.html\">Tuesday, 10 Nov<\/a> \u203a Lesson plan<\/div>\n        <h1 style=\"margin: 6px 0 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em\">Ratios in real life: scaling a recipe<\/h1>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px\">\n          <span style=\"padding: 5px 10px; border-radius: 99px; background: #E0F2FE; color: #075985; font-size: 12px; font-weight: 600\">Unit 2 \u00b7 Lesson 10 of 15<\/span>\n          <span style=\"padding: 5px 10px; border-radius: 99px; background: #F1F5F9; color: #334155; font-size: 12px; font-weight: 600\">Grade 7-B \u00b7 32 students<\/span>\n          <span style=\"padding: 5px 10px; border-radius: 99px; background: #F1F5F9; color: #334155; font-size: 12px; font-weight: 600\">79 minutes<\/span>\n          <span style=\"padding: 5px 10px; border-radius: 99px; background: #DCFCE7; color: #166534; font-size: 12px; font-weight: 600\">Reviewed by Head of Department<\/span>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n        <a href=\"Lesson.dc.html\" style=\"padding: 12px 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 14px; color: #0F172A\">Back to lesson<\/a>\n        <button type=\"button\" style=\"padding: 12px 16px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; color: #0F172A\">Edit plan<\/button>\n        <button type=\"button\" style=\"padding: 12px 16px; border-radius: 10px; border: none; background: #0F766E; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer\">Download PDF<\/button>\n      <\/div>\n    <\/header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n      <aside aria-label=\"Plan sections\" style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n        <nav aria-label=\"On this page\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px\">\n          <div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 8px 8px\">On this page<\/div>\n          <a href=\"#lp-overview\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Overview & standard<\/a>\n          <a href=\"#lp-objectives\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Objectives & success criteria<\/a>\n          <a href=\"#lp-vocab\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Vocabulary & materials<\/a>\n          <a href=\"#lp-sequence\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Lesson sequence<\/a>\n          <a href=\"#lp-diff\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Differentiation<\/a>\n          <a href=\"#lp-assess\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Assessment & homework<\/a>\n          <a href=\"#lp-notes\" style=\"display: block; padding: 9px 10px; border-radius: 8px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 500\">Teacher notes<\/a>\n        <\/nav>\n        <section aria-labelledby=\"lp-meta-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px\">\n          <h2 id=\"lp-meta-h\" style=\"margin: 0; font-size: 14px; font-weight: 700\">Plan details<\/h2>\n          <dl style=\"margin: 12px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; font-size: 13px\">\n            <dt style=\"color: #475569\">Teacher<\/dt><dd style=\"margin: 0; font-weight: 600\">Ms. Emily Carter<\/dd>\n            <dt style=\"color: #475569\">Date<\/dt><dd style=\"margin: 0; font-weight: 600\">Tue 10 Nov 2026<\/dd>\n            <dt style=\"color: #475569\">Period<\/dt><dd style=\"margin: 0; font-weight: 600\">1\u20132 \u00b7 8:00\u20139:19<\/dd>\n            <dt style=\"color: #475569\">Room<\/dt><dd style=\"margin: 0; font-weight: 600\">B-204<\/dd>\n            <dt style=\"color: #475569\">Reviewed by<\/dt><dd style=\"margin: 0; font-weight: 600\">Mr. James Walker, 8 Nov<\/dd>\n            <dt style=\"color: #475569\">Last edited<\/dt><dd style=\"margin: 0; font-weight: 600\">9 Nov, 7:42 pm<\/dd>\n          <\/dl>\n        <\/section>\n      <\/aside>\n\n      <article style=\"flex: 4 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n\n        <section id=\"lp-overview\" aria-labelledby=\"ov-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <h2 id=\"ov-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Overview & standard<\/h2>\n          <div style=\"margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: #F0F9FF; font-size: 14px; line-height: 1.55\"><strong>Standard 7.4D:<\/strong> Solve problems involving ratios, rates and percents, including multi-step problems.<\/div>\n          <p style=\"margin: 14px 0 0; font-size: 15px; line-height: 1.6\">Students move from concrete recipe cards to tape diagrams so they can see a ratio as equal-sized parts. The lesson builds the idea of a <em>unit value<\/em>: once students know what one part is worth, scaling any ratio becomes multiplication.<\/p>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px\">\n            <div style=\"padding: 14px; border-radius: 12px; background: #F8FAFC\"><div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em\">Builds on<\/div><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.5\">Equivalent fractions (Unit 1) and multiplication fluency.<\/div><\/div>\n            <div style=\"padding: 14px; border-radius: 12px; background: #F8FAFC\"><div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em\">Leads to<\/div><div style=\"font-size: 14px; margin-top: 6px; line-height: 1.5\">Lesson 11: constant of proportionality in tables.<\/div><\/div>\n          <\/div>\n        <\/section>\n\n        <section id=\"lp-objectives\" aria-labelledby=\"ob-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <h2 id=\"ob-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Objectives & success criteria<\/h2>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px\">\n            <div style=\"flex: 1 1 260px; min-width: 0\">\n              <h3 style=\"margin: 0; font-size: 14px; font-weight: 700; color: #1D4ED8\">Students will be able to<\/h3>\n              <ol style=\"margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5\">\n                <li>Represent a part-to-part ratio with a tape diagram.<\/li>\n                <li>Find the value of one part when the total is known.<\/li>\n                <li>Scale a ratio to a new total and check the answer.<\/li>\n              <\/ol>\n            <\/div>\n            <div style=\"flex: 1 1 260px; min-width: 0\">\n              <h3 style=\"margin: 0; font-size: 14px; font-weight: 700; color: #0F766E\">Success criteria: \"I can\u2026\"<\/h3>\n              <ul style=\"margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5\">\n                <li>draw equal boxes for each part of a ratio.<\/li>\n                <li>explain why I divide the total by the number of boxes.<\/li>\n                <li>show that my scaled parts add back up to the total.<\/li>\n              <\/ul>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <section id=\"lp-vocab\" aria-labelledby=\"vo-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <h2 id=\"vo-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Vocabulary & materials<\/h2>\n          <div style=\"overflow-x: auto; margin-top: 14px\">\n            <table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px\">\n              <thead><tr style=\"text-align: left; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em\"><th style=\"padding: 8px 10px; border-bottom: 1px solid #E2E8F0\">Term<\/th><th style=\"padding: 8px 10px; border-bottom: 1px solid #E2E8F0\">Student-friendly meaning<\/th><th style=\"padding: 8px 10px; border-bottom: 1px solid #E2E8F0\">Spanish<\/th><\/tr><\/thead>\n              <tbody>\n                <tr><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9; font-weight: 600\">Ratio<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">A comparison of two amounts, like 3 cups to 5 cups<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">raz\u00f3n<\/td><\/tr>\n                <tr><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9; font-weight: 600\">Part<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">One of the amounts being compared<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">parte<\/td><\/tr>\n                <tr><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9; font-weight: 600\">Whole / total<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">All the parts added together<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">total<\/td><\/tr>\n                <tr><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9; font-weight: 600\">Unit value<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">What one equal box is worth<\/td><td style=\"padding: 10px; border-bottom: 1px solid #F1F5F9\">valor unitario<\/td><\/tr>\n                <tr><td style=\"padding: 10px; font-weight: 600\">Scale factor<\/td><td style=\"padding: 10px\">The number you multiply every part by<\/td><td style=\"padding: 10px\">factor de escala<\/td><\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px\">\n            <span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">Tape diagram template (32 copies)<\/span>\n            <span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">Recipe cards, set A<\/span>\n            <span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">Problem sort cards (8 per pair)<\/span>\n            <span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">Slides 4\u20139<\/span>\n            <span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">Fraction strips (Group A)<\/span>\n            <span style=\"padding: 7px 12px; border-radius: 8px; background: #F1F5F9; font-size: 13px; font-weight: 500\">Exit slips<\/span>\n          <\/div>\n        <\/section>\n\n        <section id=\"lp-sequence\" aria-labelledby=\"sq-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n            <h2 id=\"sq-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Lesson sequence<\/h2>\n            <span style=\"font-size: 13px; color: #475569\">Click a row for the teacher script<\/span>\n          <\/div>\n          <ol style=\"list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px\">\n            <sc-for list=\"{{seq}}\" as=\"s\" hint-placeholder-count=\"6\">\n              <li style=\"border: 1px solid {{s.border}}; border-radius: 12px; overflow: hidden\">\n                <button type=\"button\" onClick=\"{{s.toggle}}\" aria-expanded=\"{{s.open}}\" style=\"width: 100%; text-align: left; display: grid; grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr) 24px; gap: 14px; align-items: start; padding: 14px 16px; border: none; background: {{s.bg}}; font-family: inherit; color: #0F172A; cursor: pointer\">\n                  <span><span style=\"display: block; font-weight: 700; font-size: 14px\">{{s.time}}<\/span><span style=\"display: block; font-size: 12px; color: #475569; margin-top: 2px\">{{s.min}}<\/span><\/span>\n                  <span><span style=\"display: block; font-size: 12px; font-weight: 700; color: {{s.color}}; text-transform: uppercase; letter-spacing: 0.04em\">{{s.comp}}<\/span><span style=\"display: block; font-size: 14px; font-weight: 600; margin-top: 4px; line-height: 1.4\">{{s.title}}<\/span><\/span>\n                  <span style=\"font-size: 13px; color: #334155; line-height: 1.45\"><strong style=\"color: #0F172A\">Students:<\/strong> {{s.students}}<\/span>\n                  <svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"margin-top: 2px\"><path d=\"{{s.chev}}\"><\/path><\/svg>\n                <\/button>\n                <sc-if value=\"{{s.isOpen}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"padding: 4px 16px 16px 120px; display: flex; flex-wrap: wrap; gap: 16px; background: {{s.bg}}\">\n                    <div style=\"flex: 2 1 300px; min-width: 0\">\n                      <div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em\">Teacher script<\/div>\n                      <ul style=\"margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5\">\n                        <sc-for list=\"{{s.script}}\" as=\"line\" hint-placeholder-count=\"3\"><li>{{line}}<\/li><\/sc-for>\n                      <\/ul>\n                    <\/div>\n                    <div style=\"flex: 1 1 200px; min-width: 0; padding: 12px; border-radius: 10px; background: #FFFBEB; font-size: 13px; line-height: 1.5\"><strong>Check for understanding:<\/strong> {{s.check}}<\/div>\n                  <\/div>\n                <\/sc-if>\n              <\/li>\n            <\/sc-for>\n          <\/ol>\n        <\/section>\n\n        <section id=\"lp-diff\" aria-labelledby=\"df-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <h2 id=\"df-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Differentiation<\/h2>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px\">\n            <div style=\"padding: 16px; border-radius: 12px; border: 1px solid #E2E8F0\"><div style=\"font-weight: 700; font-size: 14px; color: #BE185D\">Support \u00b7 Group A (9 students)<\/div><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.5\">Totals that are multiples of 8; tape template pre-drawn; fraction strips on desk. Teacher-led for the small-group block.<\/p><\/div>\n            <div style=\"padding: 16px; border-radius: 12px; border: 1px solid #E2E8F0\"><div style=\"font-weight: 700; font-size: 14px; color: #1D4ED8\">On level \u00b7 Group B (17 students)<\/div><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.5\">Mixed totals; students draw their own diagrams and check by adding the parts.<\/p><\/div>\n            <div style=\"padding: 16px; border-radius: 12px; border: 1px solid #E2E8F0\"><div style=\"font-weight: 700; font-size: 14px; color: #7C3AED\">Extension \u00b7 Group C (6 students)<\/div><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.5\">Three-part ratios (2:3:5 fruit salad) and a \"design your own recipe\" challenge.<\/p><\/div>\n            <div style=\"padding: 16px; border-radius: 12px; border: 1px solid #E2E8F0\"><div style=\"font-weight: 700; font-size: 14px; color: #0F766E\">English learners (4 students)<\/div><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.5\">Spanish glossary card, sentence frames in English and Spanish, partner seating with a bilingual buddy.<\/p><\/div>\n          <\/div>\n        <\/section>\n\n        <section id=\"lp-assess\" aria-labelledby=\"as-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <h2 id=\"as-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Assessment & homework<\/h2>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px\">\n            <div style=\"flex: 1 1 260px; min-width: 0; padding: 16px; border-radius: 12px; background: #F8FAFC\">\n              <div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em\">Exit ticket<\/div>\n              <ol style=\"margin: 8px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 6px\">\n                <li>Draw a tape diagram for a 3:5 ratio with a total of 24.<\/li>\n                <li>Explain in one sentence why 3:5 is not the same as 5:7.<\/li>\n              <\/ol>\n              <div style=\"font-size: 13px; color: #334155; margin-top: 10px\"><strong>Target:<\/strong> 24 of 32 students correct on item 1.<\/div>\n            <\/div>\n            <div style=\"flex: 1 1 260px; min-width: 0; padding: 16px; border-radius: 12px; background: #F8FAFC\">\n              <div style=\"font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em\">Homework<\/div>\n              <p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.55\">Practice Book p. 58, questions 1\u20136. Challenge: find a recipe at home and scale it for 12 people.<\/p>\n              <div style=\"font-size: 13px; color: #334155; margin-top: 10px\"><strong>Due:<\/strong> Thursday 12 Nov<\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <section id=\"lp-notes\" aria-labelledby=\"nt-h\" style=\"background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 22px 26px\">\n          <h2 id=\"nt-h\" style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Teacher notes<\/h2>\n          <ul style=\"list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px\">\n            <li style=\"padding: 12px 14px; border-radius: 10px; background: #FEF9C3; font-size: 14px; line-height: 1.5\"><strong>From last year:<\/strong> students rushed the drawing. Insist on equal-sized boxes before any numbers go in.<\/li>\n            <li style=\"padding: 12px 14px; border-radius: 10px; background: #FEF9C3; font-size: 14px; line-height: 1.5\"><strong>From Monday:<\/strong> 9 students struggled with coefficients. Use Group A time for a 5-minute warm-up on that first.<\/li>\n            <li style=\"padding: 12px 14px; border-radius: 10px; background: #F1F5F9; font-size: 14px; line-height: 1.5\"><strong>Head of Department feedback:<\/strong> Strong sequence. Consider a quick mini-whiteboard check after the We-Do step.<\/li>\n          <\/ul>\n        <\/section>\n      <\/article>\n    <\/div>\n  <\/main>\n<\/div>\n", "js": "\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.state = { open: 1 }; }\n  renderVals() {\n    const self = this;\n    const S = [\n      ['8:00', '8 min', 'Retrieval & Fluency', '#0F766E', 'Number Talk: deconstructing 3-digit multiplication', 'Solve 125 \u00d7 8 mentally, then share strategies.',\n        ['Write 125 \u00d7 8. Give one minute of silent thinking.', 'Collect three strategies and record each one visually.', 'Ask: which strategy would you use for 125 \u00d7 16?'], 'Thumbs up/down: who used a strategy different from their partner?'],\n      ['8:08', '18 min', 'Explicit Modeling', '#1D4ED8', 'Pictorial Shift: tape diagrams for recipe scaling', 'Copy the diagram, then complete the We-Do with a partner.',\n        ['I do: 3 cups mango pulp for every 5 cups milk. Draw 3 boxes and 5 boxes of equal size.', 'We do: the party needs 40 cups. 8 boxes = 40 cups, so 1 box = 5 cups.', 'Ask: how much pulp? How much milk? Check that 15 + 25 = 40.'], 'Mini-whiteboards: what is one box worth if the total is 56?'],\n      ['8:26', '18 min', 'High-Cognitive Task', '#7C3AED', 'Schema Strategy: \"Compare\" vs \"Change\" problems', 'Sort 8 problem cards in pairs, then solve one of each type.',\n        ['Hand out card sets. Pairs sort without solving.', 'Circulate: ask \"what clue told you it was a Compare problem?\"', 'Pairs solve one Compare and one Change problem with a diagram.'], 'Each pair justifies one card to the class.'],\n      ['8:44', '12 min', 'Structured Discourse', '#B45309', 'Method Comparison: number lines vs cross-multiplication', 'Turn-and-talk using sentence frames.',\n        ['Show two student solutions side by side.', 'Frame: \"Both methods work because\u2026\" / \"Ambos m\u00e9todos funcionan porque\u2026\"', 'Agree as a class when each method is quicker.'], 'Cold-call three pairs to share their sentence.'],\n      ['8:56', '18 min', 'Small Group / Practice', '#BE185D', 'Targeted Tier 2: prerequisite gap closing', 'Group A with teacher; Groups B and C on practice set B.',\n        ['Group A: friendlier numbers and fraction strips.', 'Groups B and C: practice set B, self-check with the answer card.', 'Last 5 minutes: swap and give partner feedback.'], 'Teacher notes which Group A students can draw the diagram unaided.'],\n      ['9:14', '5 min', 'Formative Assessment', '#475569', 'Quick Check: tape diagram for a 3:5 ratio', 'Complete the exit slip on their own.',\n        ['Hand out exit slips. No talking.', 'Collect at the door.', 'Enter the number correct in the day wrap-up.'], 'Target: 24 of 32 correct on item 1.']\n    ];\n    const seq = S.map(function (s, i) {\n      const on = self.state.open === i;\n      return { time: s[0], min: s[1], comp: s[2], color: s[3], title: s[4], students: s[5], script: s[6], check: s[7],\n        isOpen: on, open: on ? 'true' : 'false', bg: on ? '#F8FAFC' : '#FFFFFF', border: on ? '#94A3B8' : '#E2E8F0',\n        chev: on ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',\n        toggle: function () { self.setState({ open: on ? -1 : i }); } };\n    });\n    return { seq: seq };\n  }\n}\n"}, "Analytics": {"title": "Analytics \u2014 syllabus coverage", "html": "\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #F4F6FA; min-height: 100vh; display: flex; flex-wrap: wrap\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 232px; background: #14213D; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px\">\n    <a href=\"Login.dc.html\" aria-label=\"Teachify, sign out\" style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; text-decoration: none; color: #FFFFFF\">\n      <svg role=\"img\" aria-label=\"Teachify logo\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><rect width=\"40\" height=\"40\" rx=\"11\" fill=\"#F59E0B\"><\/rect><path d=\"M8 11.5c4.2-2.2 8.4-2.2 12 .4 3.6-2.6 7.8-2.6 12-.4v4.6c-4.2-2.2-8.4-2.2-12 .4-3.6-2.6-7.8-2.6-12-.4z\" fill=\"#14213D\"><\/path><rect x=\"17.8\" y=\"16\" width=\"4.4\" height=\"15\" rx=\"2.2\" fill=\"#14213D\"><\/rect><circle cx=\"29.5\" cy=\"28.5\" r=\"3\" fill=\"#FFFFFF\"><\/circle><\/svg>\n      <span style=\"font-family: Lexend, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em\">TEACH<span style=\"color: #F59E0B\">IFY<\/span><\/span>\n    <\/a>\n    <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 500; font-
